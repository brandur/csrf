name: csrf CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install Go
        uses: actions/setup-go@v5

      - uses: actions/checkout@v5

      - name: "Go: Build"
        run: go build

      - name: "Go: Test"
        run: go test -v

      - name: "Go: Vet"
        run: go vet

      - name: "Check: Gofmt"
        run: scripts/check_gofmt.sh
